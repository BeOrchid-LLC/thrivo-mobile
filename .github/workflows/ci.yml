name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]

# One in-flight run per branch; newer pushes cancel older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

  bundle:
    name: Expo bundle check
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      # Export a production JS bundle for both platforms. This catches import
      # resolution errors and module aliasing issues that tsc alone misses.
      # Env vars are inlined into the bundle but env.ts validation only runs
      # at app startup, so missing observability keys don't fail the export.
      - name: Bundle (expo export)
        run: npx expo export --platform all
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
